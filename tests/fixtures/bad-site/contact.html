<main id="main">
  <h1>联系我们</h1>
  <form id="contact">
    <p><label>姓名 <input name="name" required autocomplete="name"></label></p>
    <p><label>邮箱 <input name="email" type="email" required autocomplete="email"></label></p>
    <p><label>内容 <textarea name="message" required></textarea></label></p>
    <button type="submit">发送</button>
  </form>
  <p id="ok" hidden>已收到，我们会尽快回复。</p>
</main>
<script>
// Planted defect: the form never shows the success message (#ok stays hidden).
