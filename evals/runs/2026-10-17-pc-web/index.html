<!doctype html>
<html lang="zh-Hans" data-density="desktop">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Atlas 工单中心</title>
<link rel="icon" href="data:,">
<!-- Built with the Apple-Style skill as a cross-platform desktop web app:
     platform = desktop browsers (not a native Mac window), app type = web
     application, input = pointer + keyboard, container = 1024–1920 px.
     Library: ../../../skills/Apple-Style/web/{apple-style.css, liquid-glass.mjs}.
     Page CSS below is only what the library does not provide; every block is
     tagged [gap] or [page] so the evaluation can count it. The first run also
     needed 12 lines of [defect] workarounds (D1, D2 in report.md) and 63 lines
     of [gap] components (list rows, pills, states, form fields, dialog,
     toast); they were removed once the library provided them. -->
<link rel="stylesheet" href="../../../skills/Apple-Style/web/apple-style.css">
<style>
  /* [gap] CJK: the font stacks have no CJK face and the type scale uses Latin
     tracking (web-implementation.md says to add one and drop the tracking). */
  :root {
    --as-font-text: -apple-system, BlinkMacSystemFont, "SF Pro Text", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Noto Sans CJK SC", system-ui, sans-serif;
    --as-font-display: -apple-system, BlinkMacSystemFont, "SF Pro Display", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Noto Sans CJK SC", system-ui, sans-serif;
  }
  * { letter-spacing: 0 !important; }

  /* [page] application frame: .as-window assumes an in-window menu bar, so a
     web app without one needs its own full-height frame around .as-split. */
  html, body { margin: 0; block-size: 100%; }
  .app { block-size: 100dvh; display: grid; grid-template-rows: minmax(0, 1fr); background: var(--as-bg-grouped); }
  .app > .as-split { min-block-size: 0; }
  .brand { display: flex; align-items: center; gap: 8px; padding: 10px 8px 14px; font: 600 15px/20px var(--as-font-text); color: var(--as-label); }
  .brand svg { inline-size: 22px; block-size: 22px; color: var(--as-accent); }
  .as-sidebar .as-row .count { margin-inline-start: auto; font-variant-numeric: tabular-nums; }
  .app .as-toolbar-window .as-search { inline-size: 220px; }

  /* [page] ticket row layout inside .as-option (the listbox, selection,
     focus, pills and forced colours come from the library). */
  .tickets { padding: 4px 12px 24px; }
  .as-option.ticket { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 4px 16px; padding-block: 10px; }
  .ticket .title { font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .ticket .meta { grid-column: 1; display: flex; gap: 10px; align-items: center; font-size: 13px; }
  .ticket .when { grid-row: 1; grid-column: 2; font-size: 13px; font-variant-numeric: tabular-nums; }
  #loading { display: grid; gap: 8px; padding: 4px 12px; }

  /* [page] inspector content */
  .detail-title { margin: 14px 0 4px; font: 600 17px/22px var(--as-font-display); }
  .detail-body { margin: 6px 0 12px; color: var(--as-label-secondary); }
  .actions { display: flex; flex-wrap: wrap; gap: 8px; margin-block: 14px; }
  .timeline { margin: 0; padding: 0; list-style: none; }
  .timeline li { padding: 6px 0; font-size: 13px; color: var(--as-label-secondary); }
  .timeline li + li { box-shadow: inset 0 .5px 0 var(--as-separator); }
</style>
</head>
<body class="as-body">
<div class="app">
  <div class="as-split">
    <nav class="as-sidebar" aria-label="工单导航">
      <div class="brand"><svg class="as-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7l8-4 8 4-8 4zM4 12l8 4 8-4M4 17l8 4 8-4"/></svg>Atlas 工单中心</div>
      <div class="as-section-title">工作区</div>
      <a class="as-row is-selected" href="#inbox" aria-current="page"><svg class="as-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 13l3-8h12l3 8v6H3zM3 13h5l1 3h6l1-3h5"/></svg>收件箱<span class="count as-secondary" id="countAll">0</span></a>
      <a class="as-row" href="#mine"><svg class="as-icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="8" r="4"/><path d="M4 21c1-4 4-6 8-6s7 2 8 6"/></svg>我的工单<span class="count as-secondary">5</span></a>
      <a class="as-row" href="#done"><svg class="as-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12l4 4 10-10"/></svg>已解决<span class="count as-secondary">31</span></a>
      <div class="as-section-title">标签</div>
      <a class="as-row" href="#billing"><svg class="as-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 12l-8 8-9-9V3h8z"/><circle cx="7.5" cy="7.5" r="1"/></svg>账单</a>
      <a class="as-row" href="#login"><svg class="as-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 12l-8 8-9-9V3h8z"/><circle cx="7.5" cy="7.5" r="1"/></svg>登录</a>
      <a class="as-row" href="#perf"><svg class="as-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 12l-8 8-9-9V3h8z"/><circle cx="7.5" cy="7.5" r="1"/></svg>性能</a>
    </nav>
    <div class="as-split-divider" aria-label="导航栏宽度"></div>
    <main class="as-content" id="main" aria-busy="true">
      <header class="as-toolbar as-toolbar-window as-scroll-edge as-edge-top as-edge-hard">
        <h1 class="as-toolbar-title">收件箱</h1>
        <div class="as-spacer"></div>
        <label class="as-search"><svg class="as-icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></svg>
          <input type="search" id="q" aria-label="搜索工单" placeholder="搜索工单"></label>
        <div class="as-segmented" role="radiogroup" aria-label="状态筛选" id="status">
          <button class="as-segment is-selected" data-v="all">全部</button><button class="as-segment" data-v="open">待处理</button><button class="as-segment" data-v="done">已解决</button>
        </div>
        <button class="as-button as-button-filled" id="new" aria-haspopup="dialog">新建工单</button>
      </header>
      <section aria-labelledby="listLabel">
        <h2 class="as-sr-only" id="listLabel">工单列表</h2>
        <div id="loading" aria-hidden="true"><span class="as-skeleton" style="--as-skeleton-h:56px"></span><span class="as-skeleton" style="--as-skeleton-h:56px"></span><span class="as-skeleton" style="--as-skeleton-h:56px"></span></div>
        <div class="as-listbox tickets" id="list" aria-label="工单" hidden></div>
        <div class="as-empty" id="empty" hidden><p class="as-empty-title">没有符合条件的工单</p><p>换个关键词，或清除状态筛选。</p><button class="as-button as-button-gray" id="clear">清除筛选</button></div>
      </section>
    </main>
    <div class="as-split-divider" aria-label="详情栏宽度"></div>
    <aside class="as-inspector" aria-label="工单详情" id="inspector">
      <p class="detail-body">选择一个工单查看详情。</p>
    </aside>
  </div>
</div>

<dialog class="as-dialog" id="create" aria-labelledby="createTitle">
  <form id="createForm" novalidate>
    <header class="as-dialog-header"><h2 class="as-dialog-title" id="createTitle">新建工单</h2></header>
    <div class="as-dialog-body as-form">
      <label class="as-form-field"><span class="as-form-label">标题</span><input class="as-input" name="title" id="title" required autocomplete="off" aria-describedby="titleError"><span class="as-form-error" id="titleError" hidden>请填写标题。</span></label>
      <label class="as-form-field"><span class="as-form-label">描述</span><textarea class="as-input" name="body" aria-describedby="bodyHint"></textarea><span class="as-form-hint" id="bodyHint">可选。描述复现步骤与影响范围。</span></label>
      <div class="as-form-field"><span class="as-form-label" id="prioLabel">优先级</span>
        <div class="as-segmented" role="radiogroup" aria-labelledby="prioLabel" id="prio"><button type="button" class="as-segment" data-v="低">低</button><button type="button" class="as-segment is-selected" data-v="中">中</button><button type="button" class="as-segment" data-v="高">高</button></div></div>
      <label class="as-form-field"><span class="as-form-label">指派给</span><select class="as-input" name="owner"><option>未指派</option><option>林晓</option><option>陈默</option><option>王一凡</option></select></label>
      <div class="as-form-row"><span id="urgentLabel">标记为紧急</span><button type="button" class="as-toggle" role="switch" aria-checked="false" aria-labelledby="urgentLabel" id="urgent"><span class="as-knob"></span></button></div>
    </div>
    <!-- Cancel is type="button": the first submit button is the form's default, and Enter must create. -->
    <footer class="as-dialog-footer"><button class="as-button" type="button" id="cancel">取消</button><button class="as-button as-button-filled" type="submit">创建</button></footer>
  </form>
</dialog>
<!-- In the markup from the start, so the first message is announced too; toast() reuses it. -->
<div class="as-toast" role="status" aria-live="polite" aria-atomic="true"></div>

<script type="module">
  import { init, toast } from '../../../skills/Apple-Style/web/liquid-glass.mjs';
  const $ = s => document.querySelector(s);
  const people = ['林晓', '陈默', '王一凡', '未指派'];
  const subjects = ['发票金额与订单不一致', '无法通过短信验证码登录', '仪表盘加载超过 10 秒', '导出 CSV 时缺少时区', '团队成员邀请邮件未送达', '自动续费后未开具发票',
    '移动端无法上传附件', 'API 速率限制提示不明确', '深色模式下图表看不清', '单点登录回调报错 400', '搜索结果排序异常', '工单附件预览失败', '通知重复发送', '账单地址无法修改'];
  const tickets = subjects.map((title, i) => ({ id: 'T-' + (1042 + i), title, status: i % 4 === 3 ? 'done' : i % 3 === 1 ? 'waiting' : 'open',
    priority: ['高', '中', '低'][i % 3], owner: people[i % 4], updated: new Date(Date.UTC(2026, 9, 17, 9 - (i % 9), 50 - i * 3)), body: '用户反馈：' + title + '。已收集浏览器版本与复现步骤，等待进一步排查。' }));
  const label = { open: '待处理', waiting: '等待回复', done: '已解决' };
  const pill = { open: 'as-pill-info', waiting: 'as-pill-warning', done: 'as-pill-success' };
  const time = new Intl.DateTimeFormat('zh-Hans', { hour: '2-digit', minute: '2-digit', timeZone: 'Asia/Shanghai' });
  let filter = 'all', query = '', selected = tickets[0].id;

  function visible() {
    return tickets.filter(t => (filter === 'all' || (filter === 'done' ? t.status === 'done' : t.status !== 'done'))
      && (!query || (t.title + t.id + t.owner).toLowerCase().includes(query)));
  }
  // The listbox owns selection: render rows with aria-selected (and
  // tabindex="-1", so a row can take focus straight after rendering).
  function render() {
    const rows = visible(), list = $('#list');
    $('#countAll').textContent = tickets.filter(t => t.status !== 'done').length;
    $('#empty').hidden = rows.length > 0; list.hidden = rows.length === 0;
    if (rows.length && !rows.some(t => t.id === selected)) selected = rows[0].id;
    list.innerHTML = rows.map(t => `<div class="as-option ticket" id="${t.id}" aria-selected="${t.id === selected}" tabindex="-1">
      <span class="title">${t.title}</span><span class="when as-secondary">${time.format(t.updated)}</span>
      <span class="meta as-secondary"><span class="as-pill as-pill-dot ${pill[t.status]}">${label[t.status]}</span><span>${t.id}</span><span>优先级 ${t.priority}</span><span>${t.owner}</span></span></div>`).join('');
    inspect(tickets.find(t => t.id === selected && rows.includes(t)));
  }
  function inspect(t) {
    const box = $('#inspector');
    if (!t) { box.innerHTML = '<p class="detail-body">没有选中的工单。</p>'; return; }
    box.innerHTML = `<h2 class="detail-title">${t.title}</h2><p class="detail-body">${t.body}</p>
      <div class="as-inspector-title">属性</div>
      <div class="as-field"><span>编号</span><span class="as-tabular">${t.id}</span></div>
      <div class="as-field"><span>状态</span><span><span class="as-pill as-pill-dot ${pill[t.status]}">${label[t.status]}</span></span></div>
      <div class="as-field"><span>优先级</span><span>${t.priority}</span></div>
      <div class="as-field"><span>负责人</span><span>${t.owner}</span></div>
      <div class="as-field"><span id="notifyLabel">邮件通知</span><button class="as-toggle" role="switch" aria-checked="true" aria-labelledby="notifyLabel" id="notify"><span class="as-knob"></span></button></div>
      <div class="actions"><button class="as-button as-button-bordered" id="assign">指派给我</button>
        <button class="as-button as-button-tinted" id="resolve" ${t.status === 'done' ? 'disabled' : ''}>标记为已解决</button></div>
      <div class="as-inspector-title">动态</div>
      <ul class="timeline"><li>${time.format(t.updated)} · ${t.owner} 更新了工单</li><li>09:12 · 系统 自动分类为「${t.title.slice(0, 4)}」</li></ul>`;
  }
  function select(id, focus) {
    selected = id; render();
    if (focus) document.getElementById(id)?.focus();
  }

  // Arrows, Home/End, type-ahead and clicks come from LiquidGlass.listbox().
  $('#list').addEventListener('change', e => {
    selected = e.currentTarget.querySelector('[aria-selected="true"]').id;
    inspect(tickets.find(t => t.id === selected));
  });
  $('#status').addEventListener('change', e => { filter = e.currentTarget.querySelector('.is-selected').dataset.v; render(); });
  $('#q').addEventListener('input', e => { query = e.target.value.trim().toLowerCase(); render(); });
  $('#clear').addEventListener('click', () => { query = ''; $('#q').value = ''; $('#status .as-segment').click(); render(); });
  $('#inspector').addEventListener('click', e => {
    const t = tickets.find(x => x.id === selected);
    if (e.target.id === 'assign') { t.owner = '林晓'; render(); toast('已指派给你'); }
    if (e.target.id === 'resolve') { t.status = 'done'; render(); toast(t.id + ' 已标记为已解决'); }
  });
  $('#inspector').addEventListener('change', e => { if (e.target.id === 'notify') toast(e.target.getAttribute('aria-checked') === 'true' ? '已开启邮件通知' : '已关闭邮件通知'); });

  // Create dialog: <dialog>.showModal() supplies focus containment, inert background, Escape and focus return.
  const dialog = $('#create'), form = $('#createForm');
  $('#new').addEventListener('click', () => { form.reset(); $('#title').removeAttribute('aria-invalid'); $('#titleError').hidden = true; dialog.showModal(); });
  $('#cancel').addEventListener('click', () => dialog.close());
  form.addEventListener('submit', e => {
    e.preventDefault();
    const title = form.title.value.trim();
    if (!title) { $('#title').setAttribute('aria-invalid', 'true'); $('#titleError').hidden = false; $('#title').focus(); return; }
    const t = { id: 'T-' + (1042 + tickets.length), title, status: 'open', priority: $('#prio .is-selected').dataset.v, owner: form.owner.value,
      updated: new Date(), body: form.body.value.trim() || '（无描述）' };
    tickets.unshift(t); filter = 'all'; $('#status .as-segment').click(); query = ''; $('#q').value = '';
    dialog.close(); select(t.id, true); toast('已创建 ' + t.id + ($('#urgent').getAttribute('aria-checked') === 'true' ? '（紧急）' : ''));
  });

  init(document);
  setTimeout(() => { $('#loading').remove(); $('#main').removeAttribute('aria-busy'); render(); }, 400);   // simulated fetch so the loading state is real
</script>
</body>
</html>
